<!DOCTYPE html>
<!-- 提出課題 -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>過去20年のグランドスラム優勝者と準優勝者一覧</title>
</head>
<body>
    <form action="/tennis" method="POST">
        <input type="text" name="year" required>
        <label for="year">year:</label><br>
        <input type="text" name="name" required>
        <label for="name">name:</label><br>
        <input type="text" name="champion">
        <label for="champion">champion:</label><br>
        <input type="text" name="semi" required>
        <label for="semi">semi:</label><br>
        <input type="text" name="venue" required>
        <label for="venue">venue:</label><br>
        <input type="text" name="date" required>
        <label for="date">date:</label><br>
        <input type="text" name="surface" required>
        <label for="surface">surface:</label><br>
        <input type="text" name="prize" required>
        <label for="prize">prize:</label><br>
        <input type="submit" value="登録">
    </form>
</body>
</html>
